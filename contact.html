<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact | Calan Bryant</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Calendar Scheduler Styles -->
  <link
    href="https://calendar.google.com/calendar/scheduling-button-script.css"
    rel="stylesheet">

</head>

<body>

<header class="site-header">

  <div class="top-name-bar">
    <h1 class="top-name">
      CALAN BRYANT
    </h1>
  </div>

  <nav class="main-nav">
    <a href="index.html">Home</a>
    <a href="about.html">About</a>
    <a href="services.html">Services</a>
    <a href="media.html">Media</a>
    <a href="pocket.html">The Pocket</a>
    <a href="shop.html">Shop</a>
    <a href="contact.html">Contact</a>
  </nav>

</header>

<section id="contact" class="contact-section">

  <div class="contact-layout">

    <div class="contact-content">

      <div class="eyebrow contact-eyebrow">
        CONTACT
      </div>

      <h2>
        Booking & Inquiries
      </h2>

      <p class="contact-text">
        Email: calanbryant@gmail.com
      </p>

      <form
        class="contact-form"
        action="https://formspree.io/f/xykobvgg"
        method="POST"
      >

        <div class="form-grid">

          <input
            type="text"
            name="name"
            placeholder="Full Name"
            required
          >

          <input
            type="email"
            name="email"
            placeholder="Email Address"
            required
          >

          <input
            type="text"
            name="event_date"
            placeholder="Event Date"
          >

          <input
            type="text"
            name="location"
            placeholder="Location"
          >

        </div>

        <textarea
          name="details"
          placeholder="Tell us about your event, project, workshop, or booking inquiry"
          required
        ></textarea>

        <input
          type="hidden"
          name="_next"
          value="https://taylorduncan.github.io/calanbryant.github.io/contact.html"
        >

        <button
          class="btn primary"
          type="submit"
        >
          Submit Inquiry
        </button>

      </form>

      <div class="scheduler-section">

        <h3 class="scheduler-title">
          Schedule a Google Meet Call
        </h3>

        <div id="google-calendar-button"></div>

      </div>

    </div>

    <div class="contact-image">
      <img src="images/contact.jpg" alt="Calan Bryant">
    </div>

  </div>

</section>

<script src="https://calendar.google.com/calendar/scheduling-button-script.js" async></script>

<script>
  window.addEventListener('load', function () {
    calendar.schedulingButton.load({
      url: 'https://calendar.google.com/calendar/appointments/schedules/AcZssZ0pjWABkuGHPcDHtqnVlY-n0fgnsasSelpl7PHiFsrFFQBj1CPD9ZDdzsRdy72a91Uy8iFkkeyX?gv=true',
      color: '#039BE5',
      label: 'Book a Google Meet Call',
      target: document.getElementById('google-calendar-button')
    });
  });
</script>

</body>
</html>
